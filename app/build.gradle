plugins { id 'com.android.application' }

android {
    namespace 'com.nivo.installer'
    compileSdk 35
    defaultConfig {
        applicationId 'com.nivo.installer'
        minSdk 26
        targetSdk 35
        versionCode 19
        versionName '2.1.0-beta.4'
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    buildTypes {
        release {
            // Existing public Installer APKs use this exact certificate; keep update compatibility.
            signingConfig signingConfigs.debug
        }
    }
}

dependencies {
    implementation 'com.tananaev:adblib:1.3'
}

