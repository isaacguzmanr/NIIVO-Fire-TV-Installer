plugins { id 'com.android.application' }

android {
    namespace 'com.nivo.installer'
    compileSdk 35
    defaultConfig {
        applicationId 'com.nivo.installer'
        minSdk 26
        targetSdk 35
        versionCode 9
        versionName '1.5.0-beta.1'
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies {
    implementation 'com.tananaev:adblib:1.3'
}

